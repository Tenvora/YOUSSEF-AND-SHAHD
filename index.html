<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation – Youssef & Shahd</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1410;
            background-image: radial-gradient(ellipse at 50% 0%, #2d221c 0%, #0f0b09 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px 80px;
            min-height: 100vh;
        }

        /* ===== LANGUAGE TOGGLE ===== */
        .lang-toggle-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(245, 237, 228, 0.12);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 50px;
            border: 1px solid rgba(210, 180, 140, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .lang-btn {
            padding: 8px 22px;
            border: none;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s ease;
            background: transparent;
            color: #b8956e;
            letter-spacing: 1px;
        }

        .lang-btn.active {
            background: #c9ad8a;
            color: #1a1410;
            box-shadow: 0 4px 15px rgba(201, 173, 138, 0.3);
        }

        .lang-btn:hover:not(.active) {
            color: #f5ede4;
            transform: scale(1.05);
        }

        /* ===== CARD ===== */
        .invitation-card {
            max-width: 780px;
            width: 100%;
            background: #f5ede4;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 175, 0.2) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(210, 180, 140, 0.15) 0%, transparent 50%);
            border-radius: 56px 56px 40px 40px;
            padding: 50px 40px 60px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 0 1px rgba(210, 180, 140, 0.15);
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .invitation-card::before {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1px solid rgba(180, 140, 100, 0.18);
            border-radius: 44px;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .month-header {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 3.2rem;
            letter-spacing: 12px;
            color: #a67c52;
            text-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 4px;
        }

        .month-header .year {
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: #b8956e;
            display: block;
            font-weight: 400;
            margin-top: -6px;
        }

        /* ===== DAYS + NUMBERS ===== */
        .days-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #b8956e;
            letter-spacing: 1px;
            border-bottom: 2px solid #dccbbc;
            padding-bottom: 12px;
            margin-bottom: 20px;
            padding-top: 4px;
        }

        .days-row span {
            opacity: 0.6;
        }
        .days-row .highlight-day {
            font-weight: 700;
            color: #7a5a3a;
            opacity: 1;
            font-size: 1rem;
            background: rgba(200, 170, 140, 0.2);
            padding: 0 14px;
            border-radius: 20px;
            position: relative;
        }
        .days-row .highlight-day::after {
            content: '⬤';
            font-size: 0.4rem;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: #a67c52;
        }

        .numbers-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: #8a705a;
            letter-spacing: 2px;
            margin-bottom: 28px;
            padding: 0 2px;
        }

        .numbers-row span {
            opacity: 0.5;
        }
        .numbers-row .highlight-number {
            font-weight: 700;
            color: #3d2c1e;
            opacity: 1;
            font-size: 1.2rem;
        }

        /* ===== INVITATION TEXT ===== */
        .invite-text {
            text-align: center;
            margin: 12px 0 8px;
        }

        .invite-text .you-are {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 1.4rem;
            letter-spacing: 10px;
            color: #9b7b5b;
            text-transform: uppercase;
        }

        .invite-text .to-the {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 6px;
            color: #a8886a;
            margin-top: 2px;
        }

        /* ===== NAMES ===== */
        .names {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            font-size: 4.2rem;
            letter-spacing: 5px;
            color: #3d2c1e;
            margin: 6px 0 12px;
            line-height: 1.15;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .names .ampersand {
            font-style: normal;
            font-weight: 300;
            color: #b8956e;
            font-size: 3.2rem;
            margin: 0 10px;
            display: inline-block;
        }

        /* ===== DIVIDER ===== */
        .divider-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 10px 0 18px;
        }
        .divider-main .line {
            width: 70px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c7af94, transparent);
        }
        .divider-main .diamond {
            color: #b8956e;
            font-size: 1.2rem;
        }

        /* ===== DETAILS (exactly as image) ===== */
        .details {
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            font-size: 1.15rem;
            color: #4d3828;
            background: rgba(235, 220, 205, 0.3);
            padding: 20px 18px;
            border-radius: 40px;
            border: 1px solid #dccbbc;
            margin: 8px 0 20px;
            line-height: 1.9;
        }

        .details .date-time {
            font-weight: 700;
            color: #7a5a3a;
            letter-spacing: 1px;
        }

        .details .location {
            display: block;
            font-size: 1.05rem;
            color: #6f5540;
            margin-top: 4px;
            font-weight: 400;
        }

        /* ===== REPLY (exactly as image) ===== */
        .reply-text {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: #a8886a;
            opacity: 0.6;
            margin-top: 6px;
        }

        /* ===== FLOATING DECORATIONS ===== */
        .floating-element {
            position: fixed;
            font-size: 2.5rem;
            opacity: 0.2;
            pointer-events: none;
            z-index: 999;
            color: #c9ad8a;
            transition: transform 0.1s;
        }

        /* ===== SCROLL REVEAL ===== */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .scroll-reveal.delay-1 { transition-delay: 0.1s; }
        .scroll-reveal.delay-2 { transition-delay: 0.2s; }
        .scroll-reveal.delay-3 { transition-delay: 0.3s; }
        .scroll-reveal.delay-4 { transition-delay: 0.4s; }

        /* ===== SIDE CONFETTI ===== */
        .confetti-side {
            position: fixed;
            font-size: 2.2rem;
            pointer-events: none;
            z-index: 998;
            opacity: 0;
            transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .confetti-side.show {
            opacity: 0.6;
        }

        .confetti-left {
            left: 12px;
            transform: translateX(-80px) rotate(-30deg) scale(0.5);
        }
        .confetti-left.show {
            transform: translateX(0) rotate(0deg) scale(1);
        }

        .confetti-right {
            right: 12px;
            transform: translateX(80px) rotate(30deg) scale(0.5);
        }
        .confetti-right.show {
            transform: translateX(0) rotate(0deg) scale(1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .invitation-card {
                padding: 35px 20px 45px;
                border-radius: 32px;
            }
            .invitation-card::before {
                inset: 8px;
                border-radius: 28px;
            }
            .month-header {
                font-size: 2.2rem;
                letter-spacing: 6px;
            }
            .month-header .year {
                font-size: 1rem;
            }
            .days-row, .numbers-row {
                font-size: 0.65rem;
                flex-wrap: wrap;
                gap: 4px;
                justify-content: center;
            }
            .days-row .highlight-day {
                font-size: 0.8rem;
                padding: 0 10px;
            }
            .numbers-row .highlight-number {
                font-size: 1rem;
            }
            .names {
                font-size: 2.8rem;
            }
            .names .ampersand {
                font-size: 2.2rem;
            }
            .details {
                font-size: 1rem;
                padding: 16px 14px;
            }
            .floating-element {
                font-size: 1.6rem;
            }
            .confetti-side {
                font-size: 1.5rem;
            }
            .lang-toggle-wrapper {
                top: 12px;
                right: 12px;
                padding: 4px;
            }
            .lang-btn {
                padding: 6px 14px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 400px) {
            .names {
                font-size: 2.2rem;
            }
            .details {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LANGUAGE TOGGLE ===== -->
    <div class="lang-toggle-wrapper">
        <button class="lang-btn active" data-lang="en" id="langEn">EN</button>
        <button class="lang-btn" data-lang="ar" id="langAr">عربي</button>
    </div>

    <!-- ===== CARD ===== -->
    <div class="invitation-card">

        <!-- MONTH -->
        <div class="month-header scroll-reveal">
            JULY
            <span class="year">2026</span>
        </div>

        <!-- DAYS -->
        <div class="days-row scroll-reveal delay-1">
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span class="highlight-day">Fri</span>
            <span>Sat</span>
            <span>Sun</span>
            <span>Mon</span>
        </div>

        <!-- NUMBERS -->
        <div class="numbers-row scroll-reveal delay-1">
            <span>30</span>
            <span>01</span>
            <span>02</span>
            <span class="highlight-number">03</span>
            <span>04</span>
            <span>05</span>
            <span>06</span>
        </div>

        <!-- INVITATION TEXT -->
        <div class="invite-text scroll-reveal delay-2">
            <div class="you-are">You Are Invited</div>
            <div class="to-the">TO THE ENGAGEMENT OF</div>
        </div>

        <!-- NAMES -->
        <div class="names scroll-reveal delay-3">
            YOUSSEF <span class="ampersand">&amp;</span> SHAHD
        </div>

        <!-- DIVIDER -->
        <div class="divider-main scroll-reveal delay-3">
            <span class="line"></span>
            <span class="diamond">✦</span>
            <span class="line"></span>
        </div>

        <!-- DETAILS (exactly as image) -->
        <div class="details scroll-reveal delay-4">
            <span class="date-time">FRIDAY, JULY 03, 2026 | 7:00 PM</span>
            <span class="location">GAR EL QAMAR<br>OBOUR CITY ROAD 10</span>
        </div>

        <!-- REPLY (exactly as image) -->
        <div class="reply-text scroll-reveal delay-4">Reply</div>

    </div>

    <!-- ===== FLOATING DECORATIONS ===== -->
    <div class="floating-element" style="top: 8%; left: 4%;">✦</div>
    <div class="floating-element" style="top: 22%; right: 3%; animation-delay: 1.5s;">✧</div>
    <div class="floating-element" style="bottom: 18%; left: 5%; animation-delay: 3s;">✦</div>
    <div class="floating-element" style="bottom: 32%; right: 4%; animation-delay: 0.8s;">✧</div>
    <div class="floating-element" style="top: 50%; left: 2%; animation-delay: 2.2s; font-size: 1.8rem;">❋</div>
    <div class="floating-element" style="top: 65%; right: 3%; animation-delay: 4s; font-size: 1.6rem;">✧</div>

    <!-- ===== SIDE CONFETTI ===== -->
    <div class="confetti-side confetti-left" id="confettiLeft">✨</div>
    <div class="confetti-side confetti-right" id="confettiRight">🎉</div>
    <div class="confetti-side confetti-left" id="confettiLeft2" style="top: 30%; font-size: 1.8rem;">🌸</div>
    <div class="confetti-side confetti-right" id="confettiRight2" style="top: 45%; font-size: 2rem;">🌿</div>
    <div class="confetti-side confetti-left" id="confettiLeft3" style="top: 60%; font-size: 1.6rem;">💫</div>
    <div class="confetti-side confetti-right" id="confettiRight3" style="top: 75%; font-size: 1.7rem;">🎊</div>
    <div class="confetti-side confetti-left" id="confettiLeft4" style="top: 88%; font-size: 1.4rem;">🌹</div>
    <div class="confetti-side confetti-right" id="confettiRight4" style="top: 92%; font-size: 1.5rem;">💝</div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ===== LANGUAGE TOGGLE (only visual, no extra data) =====
            const langEn = document.getElementById('langEn');
            const langAr = document.getElementById('langAr');

            // We keep all text in English as original, but for Arabic we just translate the visible text
            // without adding any new data fields.
            const originalTexts = {
                month: 'JULY',
                year: '2026',
                days: ['Tue','Wed','Thu','Fri','Sat','Sun','Mon'],
                numbers: ['30','01','02','03','04','05','06'],
                youAre: 'You Are Invited',
                toThe: 'TO THE ENGAGEMENT OF',
                names: 'YOUSSEF & SHAHD',
                dateTime: 'FRIDAY, JULY 03, 2026 | 7:00 PM',
                location: 'GAR EL QAMAR\nOBOUR CITY ROAD 10',
                reply: 'Reply'
            };

            const arabicTexts = {
                month: 'يوليو',
                year: '٢٠٢٦',
                days: ['ثلاثاء','أربعاء','خميس','جمعة','سبت','أحد','إثنين'],
                numbers: ['٣٠','٠١','٠٢','٠٣','٠٤','٠٥','٠٦'],
                youAre: 'أنتم مدعوون',
                toThe: 'لحفل خطوبة',
                names: 'يوسف & شهد',
                dateTime: 'الجمعة، ٣ يوليو ٢٠٢٦ | ٧:٠٠ مساءً',
                location: 'جر القمر\nطريق أكتوبر، الدائري ١٠',
                reply: 'رد'
            };

            function setLanguage(lang) {
                if (lang === 'en') {
                    langEn.classList.add('active');
                    langAr.classList.remove('active');
                    // Update all elements
                    document.querySelector('.month-header').childNodes[0].textContent = originalTexts.month;
                    document.querySelector('.month-header .year').textContent = originalTexts.year;
                    const daySpans = document.querySelectorAll('.days-row span');
                    originalTexts.days.forEach((d, i) => daySpans[i].textContent = d);
                    const numSpans = document.querySelectorAll('.numbers-row span');
                    originalTexts.numbers.forEach((n, i) => numSpans[i].textContent = n);
                    document.querySelector('.you-are').textContent = originalTexts.youAre;
                    document.querySelector('.to-the').textContent = originalTexts.toThe;
                    // Names with ampersand
                    const nameContainer = document.querySelector('.names');
                    nameContainer.innerHTML = `YOUSSEF <span class="ampersand">&amp;</span> SHAHD`;
                    // Details: date + location
                    const detailsDiv = document.querySelector('.details');
                    detailsDiv.innerHTML = `
                        <span class="date-time">${originalTexts.dateTime}</span>
                        <span class="location">${originalTexts.location.replace('\n', '<br>')}</span>
                    `;
                    document.querySelector('.reply-text').textContent = originalTexts.reply;
                } else {
                    langAr.classList.add('active');
                    langEn.classList.remove('active');
                    document.querySelector('.month-header').childNodes[0].textContent = arabicTexts.month;
                    document.querySelector('.month-header .year').textContent = arabicTexts.year;
                    const daySpans = document.querySelectorAll('.days-row span');
                    arabicTexts.days.forEach((d, i) => daySpans[i].textContent = d);
                    const numSpans = document.querySelectorAll('.numbers-row span');
                    arabicTexts.numbers.forEach((n, i) => numSpans[i].textContent = n);
                    document.querySelector('.you-are').textContent = arabicTexts.youAre;
                    document.querySelector('.to-the').textContent = arabicTexts.toThe;
                    const nameContainer = document.querySelector('.names');
                    nameContainer.innerHTML = `يوسف <span class="ampersand">&amp;</span> شهد`;
                    const detailsDiv = document.querySelector('.details');
                    detailsDiv.innerHTML = `
                        <span class="date-time">${arabicTexts.dateTime}</span>
                        <span class="location">${arabicTexts.location.replace('\n', '<br>')}</span>
                    `;
                    document.querySelector('.reply-text').textContent = arabicTexts.reply;
                }
            }

            langEn.addEventListener('click', () => setLanguage('en'));
            langAr.addEventListener('click', () => setLanguage('ar'));

            // ===== SCROLL REVEAL =====
            const revealElements = document.querySelectorAll('.scroll-reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
            revealElements.forEach(el => observer.observe(el));

            // ===== SIDE CONFETTI ON SCROLL =====
            const confettiItems = [
                document.getElementById('confettiLeft'),
                document.getElementById('confettiRight'),
                document.getElementById('confettiLeft2'),
                document.getElementById('confettiRight2'),
                document.getElementById('confettiLeft3'),
                document.getElementById('confettiRight3'),
                document.getElementById('confettiLeft4'),
                document.getElementById('confettiRight4')
            ];

            function handleScrollConfetti() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                const maxScroll = documentHeight - windowHeight;
                const progress = maxScroll > 0 ? scrollY / maxScroll : 0;
                const thresholds = [0.05, 0.15, 0.28, 0.42, 0.56, 0.70, 0.82, 0.92];

                confettiItems.forEach((el, index) => {
                    if (!el) return;
                    const threshold = thresholds[index % thresholds.length];
                    const randomOffset = (Math.random() * 0.06) - 0.03;
                    const effectiveThreshold = Math.min(1, Math.max(0, threshold + randomOffset));
                    if (progress > effectiveThreshold) {
                        el.classList.add('show');
                    } else {
                        el.classList.remove('show');
                    }
                });
            }

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        handleScrollConfetti();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // ===== PARALLAX FLOATING =====
            const floaters = document.querySelectorAll('.floating-element');
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                floaters.forEach((el, i) => {
                    const speed = 0.025 + (i * 0.008);
                    const yOffset = scrollY * speed;
                    const xOffset = Math.sin(scrollY * 0.0015 + i * 1.2) * 10;
                    el.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
                });
            });

            // ===== INIT =====
            window.addEventListener('load', () => {
                handleScrollConfetti();
                revealElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight * 0.85) {
                        el.classList.add('visible');
                    }
                });
                setLanguage('en');
            });

        })();
    </script>

</body>
</html>
